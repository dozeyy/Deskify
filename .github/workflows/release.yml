# Builds Deskify-Setup.exe on a Windows runner (WPF only builds on Windows).
# Pushing a version tag (e.g. v0.1.4) publishes it as a GitHub release, with the
# tag's message as the notes; a manual run only uploads the installer as an artifact.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Deskify Setup
        run: powershell -ExecutionPolicy Bypass -File installer\build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Deskify-Setup
          path: installer/out/Deskify-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/out/Deskify-Setup.exe \
            --title "Deskify $GITHUB_REF_NAME" --notes-from-tag --verify-tag
